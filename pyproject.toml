[project]
name = "arbs"
version = "0.1.0"
description = "Read-only Kalshi and Polymarket market-data adapters"
requires-python = ">=3.12"
dependencies = ["certifi>=2024.7.4"]

[project.scripts]
arbs-connectivity = "arbs.connectivity:main"
arbs-ingest = "arbs.ingest:main"
arbs-normalize = "arbs.normalization:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
